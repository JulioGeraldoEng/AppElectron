<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Funcionário</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    .msg {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Cadastrar Novo Funcionário</h1>

  <form id="form-cadastrar-funcionario" autocomplete="off">
    <label for="email">E-mail:<span style="color: red;">*</span></label>
    <input type="email" id="email" name="email" required placeholder="exemplo@provedor.com" />

    <label for="senha">Senha:<span style="color: red;">*</span></label>
    <input type="password" id="senha" name="senha" required placeholder="Digite uma senha segura" />

    <label for="nome">Nome Completo:<span style="color: red;">*</span></label>
    <input type="text" id="nome" name="nome" required placeholder="Nome completo" />

    <label for="cargo">Cargo:</label>
    <input type="text" id="cargo" name="cargo" placeholder="Ex: Técnico, Atendimento" />

    <label for="telefone">Telefone:</label>
    <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-9999" />

    <label for="endereco">Endereço:</label>
    <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro" />

    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf" placeholder="Somente números" maxlength="11" />

    <label for="rg">RG:</label>
    <input type="text" id="rg" name="rg" placeholder="Somente números" maxlength="9" />

    <label for="data_nascimento">Data de Nascimento:</label>
    <input type="date" id="data_nascimento" name="data_nascimento" />

    <label for="data_admissao">Data de Admissão:</label>
    <input type="date" id="data_admissao" name="data_admissao" />

    <button type="submit">Cadastrar</button>
  </form>

  <button id="btn-voltar" type="button">Voltar</button>

  <div class="msg" id="mensagem"></div>

  <script src="cadastrarFuncionario.js"></script>
</body>
</html>
